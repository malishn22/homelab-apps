name: spotify-archiver

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685  # postgres:16-alpine, pinned 2026-09-10
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spotify_export}
      POSTGRES_USER: ${POSTGRES_USER:-spotify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spotify} -d ${POSTGRES_DB:-spotify_export}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - homelab

  spotify-export:
    image: ghcr.io/malishn22/spotify-archiver:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./exports:/app/exports
      - ./data:/app/data
      - ../spotify-archiver-web/.spotify_token_cache:/app/.spotify_cache_dir
    networks:
      - homelab
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.spotify-sync.schedule: "0 0 6 */2 * *"
      ofelia.job-exec.spotify-sync.command: "python -m src.main run"
      ofelia.job-exec.spotify-sync.no-overlap: "true"

  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    depends_on:
      - spotify-export
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

volumes:
  pgdata:

networks:
  homelab:
    external: true
    name: homelab
